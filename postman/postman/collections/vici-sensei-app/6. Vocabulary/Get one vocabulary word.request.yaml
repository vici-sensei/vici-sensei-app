$kind: http-request
url: "{{baseUrl}}/api/vocabulary/{{vocabId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('has word + kana_reading', () => {
        pm.expect(body.word).to.be.a('string');
        pm.expect(body.kana_reading).to.be.a('string');
      });
    language: text/javascript
order: 4000
