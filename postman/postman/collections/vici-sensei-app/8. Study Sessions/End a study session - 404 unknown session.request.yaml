$kind: http-request
url: "{{baseUrl}}/api/study/session/end"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "session_id": {{missingId}}
    }
scripts:
  - type: afterResponse
    code: pm.test('status is 404', () => pm.response.to.have.status(404));
    language: text/javascript
order: 3000
