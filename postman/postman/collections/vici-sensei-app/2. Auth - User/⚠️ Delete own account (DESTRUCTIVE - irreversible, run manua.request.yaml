$kind: http-request
name: ⚠️ Delete own account (DESTRUCTIVE - irreversible, run manually only)
description: Cancels active Stripe subscriptions then hard-deletes the auth.users row (cascades to public.users and every progress table via ON DELETE CASCADE). Do not run this against an account you want to keep. Not included in any suggested Collection Runner pass.
url: "{{baseUrl}}/api/user/me"
method: DELETE
scripts:
  - type: afterResponse
    code: pm.test('status is 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 5000
