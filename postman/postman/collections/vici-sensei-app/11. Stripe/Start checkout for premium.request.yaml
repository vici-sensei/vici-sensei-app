$kind: http-request
description: 500s with a clear message if STRIPE_PRICE_ID / STRIPE_SECRET_KEY are not configured in .env.local - that is expected outside a fully configured Stripe test environment.
url: "{{baseUrl}}/api/stripe/create-checkout-session"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200 or 500 (needs STRIPE_PRICE_ID)', () => pm.expect(pm.response.code).to.be.oneOf([200, 500]));
      if (pm.response.code === 200) {
        pm.test('has checkout url', () => pm.expect(pm.response.json().url).to.be.a('string'));
      }
    language: text/javascript
order: 1000
