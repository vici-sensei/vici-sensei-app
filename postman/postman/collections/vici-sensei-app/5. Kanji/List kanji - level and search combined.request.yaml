$kind: http-request
url: "{{baseUrl}}/api/kanji?level=N5&search=a"
method: GET
queryParams:
  level: N5
  search: a
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('every row matches the level filter', () => {
        pm.expect(body.data.every((k) => k.level === 'N5')).to.equal(true);
      });
    language: text/javascript
order: 2300
