$kind: http-request
name: Get one kanji - no related words
url: "{{baseUrl}}/api/kanji/{{kanjiIdNoWords}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('words is an empty array', () => {
        pm.expect(body.words).to.be.an('array');
        pm.expect(body.words).to.have.lengthOf(0);
      });
    language: text/javascript
order: 4100
