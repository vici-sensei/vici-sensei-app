$kind: http-request
description: Deterministic version of the 404 branch already exercised loosely by 'Reset a card to new (meaning)' - {{missingId}} guarantees no progress row exists.
url: "{{baseUrl}}/api/cards/meaning/{{missingId}}/reset"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 404', () => pm.response.to.have.status(404));
      pm.test('has error message', () => pm.expect(pm.response.json()).to.have.property('error'));
    language: text/javascript
order: 4000
