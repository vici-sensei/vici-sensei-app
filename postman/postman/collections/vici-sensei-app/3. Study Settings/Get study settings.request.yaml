$kind: http-request
description: user_study_settings is auto-created at signup, so this is always 200 (onboarding_completed is false until /api/onboarding/complete has been called).
url: "{{baseUrl}}/api/study-settings"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('has enabled_levels array', () => pm.expect(body.enabled_levels).to.be.an('array'));
      pm.test('has new_kanji_per_day', () => pm.expect(body.new_kanji_per_day).to.be.a('number'));
      pm.test('has onboarding_completed boolean', () => pm.expect(body.onboarding_completed).to.be.a('boolean'));
    language: text/javascript
order: 1000
