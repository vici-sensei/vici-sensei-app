$kind: http-request
name: Update study settings - study_kanji and study_vocabulary both true
url: "{{baseUrl}}/api/study-settings"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "study_kanji": true,
      "study_vocabulary": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('study_kanji true', () => pm.expect(body.study_kanji).to.eql(true));
      pm.test('study_vocabulary true', () => pm.expect(body.study_vocabulary).to.eql(true));
    language: text/javascript
order: 3900
