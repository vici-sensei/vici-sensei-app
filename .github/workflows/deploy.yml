name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Multi-region client (lib/supabase/regions.ts) -- Phase 7 turns it on deliberately.
          NEXT_PUBLIC_MULTI_REGION: ${{ secrets.NEXT_PUBLIC_MULTI_REGION }}
          NEXT_PUBLIC_SUPABASE_URL_EU: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_EU }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY_EU: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_EU }}
          NEXT_PUBLIC_SUPABASE_URL_US: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_US }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY_US: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_US }}
          # Email + password sign-in (docs/PASSWORD_AUTH_PLAN.md). Both are read at BUILD time, so they
          # must be set here too, not only in .env.local. A secret that doesn't exist yet expands to an
          # empty string: the flag stays off and no captcha widget is rendered -- safe by default.
          NEXT_PUBLIC_PASSWORD_AUTH: ${{ secrets.NEXT_PUBLIC_PASSWORD_AUTH }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
