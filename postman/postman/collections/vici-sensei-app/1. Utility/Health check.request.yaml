$kind: http-request
url: "{{baseUrl}}/api/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('status: ok', () => pm.expect(pm.response.json().status).to.eql('ok'));
    language: text/javascript
order: 1000
