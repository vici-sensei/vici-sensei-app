$kind: http-request
description: Requires /api/onboarding/complete to have run first (404s otherwise, same as /api/study-settings).
url: "{{baseUrl}}/api/study/queue"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('has queue arrays', () => {
        pm.expect(body.due_cards).to.be.an('array');
        pm.expect(body.new_kanji_to_introduce).to.be.an('array');
        pm.expect(body.new_vocab_to_introduce).to.be.an('array');
      });
    language: text/javascript
order: 1000
