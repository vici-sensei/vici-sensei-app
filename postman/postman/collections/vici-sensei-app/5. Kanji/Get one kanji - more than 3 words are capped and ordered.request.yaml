$kind: http-request
url: "{{baseUrl}}/api/kanji/{{kanjiIdManyWords}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('words is capped at 3', () => {
        pm.expect(body.words).to.be.an('array');
        pm.expect(body.words).to.have.lengthOf(3);
      });
      pm.test('words are ordered by reading_number asc (nulls last), then priority_score desc (nulls last)', () => {
        const rn = (w) => (w.reading_number === null || w.reading_number === undefined ? Infinity : w.reading_number);
        for (let i = 1; i < body.words.length; i++) {
          const prev = body.words[i - 1];
          const curr = body.words[i];
          if (rn(prev) === rn(curr)) {
            const ps = (w) => (w.priority_score === null || w.priority_score === undefined ? -Infinity : w.priority_score);
            pm.expect(ps(prev)).to.be.at.least(ps(curr));
          } else {
            pm.expect(rn(prev)).to.be.at.most(rn(curr));
          }
        }
      });
    language: text/javascript
order: 4200
