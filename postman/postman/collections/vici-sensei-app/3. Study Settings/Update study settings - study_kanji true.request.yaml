$kind: http-request
name: Update study settings - study_kanji true
description: Restores study_kanji to true after the disable test.
url: "{{baseUrl}}/api/study-settings"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "study_kanji": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('study_kanji enabled', () => pm.expect(body.study_kanji).to.eql(true));
    language: text/javascript
order: 3750
