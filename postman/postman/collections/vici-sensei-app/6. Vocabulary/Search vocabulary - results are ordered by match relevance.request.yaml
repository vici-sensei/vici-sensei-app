$kind: http-request
description: Also saves the total match count into the collectionVariable `broadVocabSearchCount`, consumed by 'List vocabulary - search count stays consistent when paginated' below - run these two back to back.
url: "{{baseUrl}}/api/vocabulary?search=a&limit=500"
method: GET
queryParams:
  search: a
  limit: "500"
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      const query = 'a';

      function tierOf(row) {
        const word = (row.word || '').toLowerCase();
        const kana = (row.kana_reading || '').toLowerCase();
        const romaji = (row.romaji_reading || '').toLowerCase();
        const meanings = (row.meanings || []).map((m) => (m || '').toLowerCase());

        if (word === query) return 0;
        if (kana === query || romaji === query) return 1;
        if (word.startsWith(query) || kana.startsWith(query) || romaji.startsWith(query)) return 2;
        if (word.includes(query) || kana.includes(query) || romaji.includes(query)) return 3;
        if (meanings.some((m) => m.startsWith(query))) return 4;
        if (meanings.some((m) => m.includes(query))) return 5;
        return 99;
      }

      pm.test('results are non-decreasing in match tier (exact/prefix word+reading matches sort before meaning-only substring matches)', () => {
        const tiers = body.data.map(tierOf);
        for (let i = 1; i < tiers.length; i++) {
          pm.expect(tiers[i], `row ${i} (tier ${tiers[i]}) sorted after row ${i - 1} (tier ${tiers[i - 1]}) out of order`).to.be.at.least(tiers[i - 1]);
        }
      });

      pm.test('every returned row matches on a recognized tier (sanity check on the test itself, not just the API)', () => {
        pm.expect(body.data.every((row) => tierOf(row) < 99)).to.equal(true);
      });

      pm.collectionVariables.set('broadVocabSearchCount', body.count);
    language: text/javascript
order: 2010
