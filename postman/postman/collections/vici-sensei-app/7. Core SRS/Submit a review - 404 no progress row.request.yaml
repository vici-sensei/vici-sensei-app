$kind: http-request
url: "{{baseUrl}}/api/study/review"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "exercise_type": "kanji_meaning",
      "kanji_id": {{missingId}},
      "rating": 2
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 404', () => pm.response.to.have.status(404));
      pm.test('error mentions introduce it first', () => pm.expect(pm.response.json().error).to.include('Introduce it first'));
    language: text/javascript
order: 6000
