$kind: http-request
description: 400s if this user has no stripe_customer_id yet (i.e. never started checkout).
url: "{{baseUrl}}/api/stripe/create-portal-session"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200 or 400 or 500', () => pm.expect(pm.response.code).to.be.oneOf([200, 400, 500]));
      if (pm.response.code === 200) {
        pm.test('has portal url', () => pm.expect(pm.response.json().url).to.be.a('string'));
      } else if (pm.response.code === 400) {
        pm.test('error mentions no billing profile', () => pm.expect(pm.response.json().error).to.include('no Stripe billing profile'));
      }
    language: text/javascript
order: 2000
