$kind: http-request
url: "{{baseUrl}}/api/kanji?search=DAY"
method: GET
queryParams:
  search: DAY
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('uppercase search matches case-insensitively, same as search=day', () => {
        pm.expect(body.data).to.be.an('array');
        pm.expect(body.count).to.be.a('number').greaterThan(0);
      });
    language: text/javascript
order: 2030
