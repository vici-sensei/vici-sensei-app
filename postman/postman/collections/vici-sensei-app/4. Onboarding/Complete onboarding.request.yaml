$kind: http-request
description: Upserts user_study_settings, so this is safe to re-run - it will not 409/fail on a second call.
url: "{{baseUrl}}/api/onboarding/complete"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "enabled_levels": ["N5"],
      "new_kanji_per_day": 2,
      "new_vocab_per_day": 12
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 201', () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test('enabled_levels persisted', () => pm.expect(body.enabled_levels).to.eql(['N5']));
      pm.test('new_kanji_per_day persisted', () => pm.expect(body.new_kanji_per_day).to.eql(2));
    language: text/javascript
order: 1000
