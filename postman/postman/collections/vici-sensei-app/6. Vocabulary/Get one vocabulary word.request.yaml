$kind: http-request
description: Also saves the fetched word into the collectionVariable `vocabWord`, consumed by 'Search vocabulary - exact word match ranks first' below - run these two back to back.
url: "{{baseUrl}}/api/vocabulary/{{vocabId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('has word + kana_reading', () => {
        pm.expect(body.word).to.be.a('string');
        pm.expect(body.kana_reading).to.be.a('string');
      });
      pm.collectionVariables.set('vocabWord', body.word);
    language: text/javascript
order: 4000
