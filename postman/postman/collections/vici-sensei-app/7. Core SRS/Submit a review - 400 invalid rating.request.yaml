$kind: http-request
url: "{{baseUrl}}/api/study/review"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "exercise_type": "kanji_meaning",
      "kanji_id": {{kanjiId}},
      "rating": 5
    }
scripts:
  - type: afterResponse
    code: pm.test('status is 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000
