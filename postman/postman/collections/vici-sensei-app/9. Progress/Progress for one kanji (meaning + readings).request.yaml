$kind: http-request
description: meaning is null if this kanji has never been introduced for the logged-in user.
url: "{{baseUrl}}/api/progress/kanji/{{kanjiId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('has meaning + readings keys', () => {
        pm.expect(body).to.have.property('meaning');
        pm.expect(body.readings).to.be.an('array');
      });
    language: text/javascript
order: 2000
